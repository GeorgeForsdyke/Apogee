<style>
/* Layout: one phone-width column — an altitude rail on the left, the mission panel on the right; the sky behind darkens as you climb. Single deliberate night-sky theme. */
:root{
  --panel:#0d1433; --panel-2:#151d48; --ink:#eef1ff; --muted:#a3abd0; --line:rgba(238,241,255,.14);
  --flame:#ffb547; --bad:#ff7a7a;
  --t1:#9fb0d4; --t2:#5cc8ff; --t3:#b69cff; --t4:#ffd166;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --sky-top:#4f86c6; --sky-bot:#bcd8ee;
  color-scheme:dark;
}
html,body{height:100%}
body{background:#0a0d1f;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
#sky{position:fixed;inset:0;z-index:-2;background:linear-gradient(180deg,var(--sky-top),var(--sky-bot))}
#stars{position:fixed;inset:0;z-index:-1;width:100%;height:100%;pointer-events:none}
#exhaust{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;border-radius:14px}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);transform:translateX(-50%);z-index:5;background:var(--flame);color:#1d1203;font-family:var(--display);font-weight:900;font-size:20px;letter-spacing:.04em;padding:8px 16px;border-radius:999px;white-space:nowrap;box-shadow:0 8px 30px rgba(255,181,71,.35);pointer-events:none}
#toast.show{animation:toast 1.6s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-14px) scale(.8)}15%{opacity:1;transform:translate(-50%,0) scale(1)}80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-8px)}}
.mark.pop span{animation:mpop .9s ease-out}
@keyframes mpop{0%{color:var(--flame);transform:scale(1)}30%{color:var(--flame);transform:scale(1.35)}100%{transform:scale(1)}}
.mark span{display:inline-block;transform-origin:left center}
.badge{animation:bpop .55s cubic-bezier(.2,1.6,.4,1) both}
@keyframes bpop{0%{opacity:0;transform:scale(.6)}100%{opacity:1;transform:scale(1)}}
.flight{position:relative;height:220px;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#0a1030}
.flight canvas{display:block;width:100%;height:100%}
.flyalt{position:absolute;left:12px;top:10px;font-family:var(--mono);font-weight:700;font-size:18px;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.6);font-variant-numeric:tabular-nums}
.flypts{position:absolute;right:12px;top:8px;font-family:var(--display);font-weight:900;font-size:30px;line-height:1;text-shadow:0 2px 10px rgba(0,0,0,.5);animation:bpop .55s cubic-bezier(.2,1.6,.4,1) both;animation-delay:.25s}
#bh{position:fixed;inset:0;z-index:6;pointer-events:none}
#bh canvas{width:100%;height:100%;display:block}
.quake{animation:quake .7s cubic-bezier(.36,.07,.19,.97)}
@keyframes quake{10%,90%{transform:translate(-2px,1px)}20%,80%{transform:translate(4px,-2px)}30%,50%,70%{transform:translate(-7px,3px)}40%,60%{transform:translate(7px,-3px)}}
.brief{border-left:3px solid var(--flame);padding-left:12px;display:flex;flex-direction:column;gap:6px}
.logbook{display:flex;flex-direction:column;gap:4px}
.logbook .lbline{font-family:var(--mono);font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums}
.logbook .lbline b{color:var(--ink);font-weight:800}
.logbook .lbline b.hot{color:var(--flame)}
.snd{background:none;border:none;padding:2px 0;font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:20px 32px;display:grid;grid-template-columns:76px minmax(0,1fr);gap:12px;min-height:100%;box-sizing:border-box}

/* rail */
.rail{position:relative;background:rgba(8,12,34,.55);border:1px solid var(--line);border-radius:14px;min-height:560px;backdrop-filter:blur(4px)}
.track{position:absolute;left:18px;top:18px;bottom:18px;width:2px;background:linear-gradient(180deg,rgba(238,241,255,.5),rgba(238,241,255,.15))}
.mark{position:absolute;left:-4px;transform:translateY(50%);display:flex;align-items:center;gap:6px;white-space:nowrap}
.mark i{width:10px;height:2px;background:var(--muted);display:block}
.mark span{font-family:var(--mono);font-size:9.5px;letter-spacing:.04em;color:var(--muted);text-transform:uppercase}
.mark.passed i{background:var(--flame)} .mark.passed span{color:var(--ink)}
.rocket{position:absolute;left:-11px;bottom:0;width:24px;height:40px;transform:translateY(50%);will-change:transform;z-index:2}
.rocket .fl{transform-origin:12px 30px;animation:flick .18s infinite alternate}
@keyframes flick{to{transform:scaleY(.7)}}

/* panel */
.panel{background:rgba(13,20,51,.92);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:18px;min-width:0;backdrop-filter:blur(6px)}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.word{font-family:var(--display);font-weight:900;font-size:40px;line-height:.9;letter-spacing:.06em;margin:0}
.word small{display:block;font-family:var(--mono);font-weight:500;font-size:11px;letter-spacing:.12em;color:var(--muted);margin-top:6px}
.alt{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.alt b{display:block;font-size:20px;color:var(--flame)}
.alt span{font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}

h2{font-family:var(--display);font-weight:700;font-size:30px;line-height:1.05;margin:0;text-wrap:balance;letter-spacing:.01em}
p{margin:0}
.lede{font-size:17px;color:var(--ink)}
.muted{color:var(--muted)}
.label{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

.tiers{display:grid;gap:0;border-top:1px solid var(--line)}
.tier{display:grid;grid-template-columns:14px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.tier .dot{width:10px;height:10px;border-radius:50%}
.tier em{font-style:normal;color:var(--muted);font-size:13px;display:block}
.tier b.pts{font-family:var(--mono);font-variant-numeric:tabular-nums}

.btns{display:flex;flex-direction:column;gap:10px}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);padding:13px 16px;background:var(--panel-2);color:var(--ink);font-weight:700}
button.go{background:var(--flame);color:#1d1203;border-color:transparent;font-family:var(--display);font-size:22px;letter-spacing:.04em;padding:12px 16px}
button:hover{filter:brightness(1.08)}
button:focus-visible,input:focus-visible{outline:3px solid var(--t2);outline-offset:2px}
button.link{background:none;border:none;padding:4px 0;color:var(--muted);font-weight:400;text-decoration:underline;text-underline-offset:3px;align-self:flex-start}

/* play */
.prog{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pips{display:flex;gap:5px}
.pip{width:18px;height:6px;border-radius:3px;background:var(--line)}
.timer{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.timer i{display:block;height:100%;width:100%;background:var(--t2);transform-origin:left}
.timer.low i{background:var(--bad)}
.secs{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}
.q{font-family:var(--display);font-weight:900;font-size:clamp(30px,8vw,42px);line-height:1;margin:4px 0 0;text-wrap:balance}
form{display:flex;gap:8px}
input{flex:1;min-width:0;font:inherit;font-size:18px;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:#070b22;color:var(--ink)}
.msg{min-height:22px;font-size:14px;color:var(--bad)}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

.fb{border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;background:#0a1030}
.badge{display:inline-flex;align-items:center;gap:8px;font-family:var(--display);font-weight:900;font-size:28px;letter-spacing:.03em;line-height:1}
.badge small{font-family:var(--mono);font-size:14px;font-weight:700}

/* results */
.big{font-family:var(--display);font-weight:900;font-size:64px;line-height:.9;color:var(--flame);font-variant-numeric:tabular-nums}
.rows{display:grid;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:10px 0;border-bottom:1px solid var(--line)}
.row .p{font-size:13px;color:var(--muted)}
.row .a{font-weight:700;overflow-wrap:anywhere}
.row .s{grid-row:1 / span 2;grid-column:2;align-self:center;font-family:var(--mono);font-size:13px;text-align:right}
textarea{width:100%;box-sizing:border-box;font-family:var(--mono);font-size:13px;background:#070b22;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px;min-height:96px}
.note{font-size:13px;color:var(--muted)}

/* social */
.row2{display:flex;gap:8px;flex-wrap:wrap}
.row2>*{flex:1 1 120px}
.tabs{display:flex;gap:4px;background:#070b22;border:1px solid var(--line);border-radius:10px;padding:4px}
.tabs button{flex:1;padding:9px;border:none;background:none;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--panel-2);color:var(--ink)}
.lb{display:grid;border-top:1px solid var(--line)}
.lbr{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.lbr .rk{font-family:var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.lbr .nm{font-weight:700;overflow-wrap:anywhere}
.lbr .nm em{font-style:normal;font-weight:400;color:var(--muted);font-size:12px;display:block;font-family:var(--mono);letter-spacing:.06em}
.lbr .sc{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.lbr.me .nm{color:var(--flame)}
.lbr.idle{opacity:.55}
.wk{display:inline-flex;gap:3px;margin-top:4px}.wk i{width:9px;height:9px;border-radius:2px;background:var(--line)}.wk i.on{background:var(--t2)}.wk i.today{outline:1px solid var(--muted)}
.code{font-family:var(--mono);font-size:30px;letter-spacing:.22em;font-weight:700;color:var(--flame)}
.ok{color:var(--t2);font-size:14px;min-height:20px}
.err{color:var(--bad);font-size:14px;min-height:20px}


/* ===== Terminal skin: pixel wordmark, monospace, bracket controls, flat dark ===== */
:root{--bg:#060912;--panel:#0b1020;--panel-2:#111830;--ink:#e8ecf8;--muted:#7f89aa;--line:rgba(232,236,248,.16);
  --display:"Silkscreen","Courier New",monospace;--body:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;--mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace}
body{background:var(--bg);font-family:var(--mono);font-size:15px;line-height:1.55}
#sky{display:none}
.app{max-width:600px}
.panel{background:transparent;border:none;padding:4px 0 0;backdrop-filter:none;gap:22px}
.rail{background:transparent;border:none;border-right:1px dashed var(--line);border-radius:0;backdrop-filter:none}
.word{font-family:var(--display);font-weight:700;font-size:44px;letter-spacing:.02em;line-height:.9}
.word small{font-family:var(--mono);letter-spacing:.16em;margin-top:10px}
.alt b{font-family:var(--mono);font-weight:800;font-size:18px}
h2{font-family:var(--mono);font-weight:800;font-size:22px;letter-spacing:-.01em;line-height:1.25}
.lede{font-size:15px;color:var(--ink)}
.q{font-family:var(--mono);font-weight:800;font-size:clamp(24px,6.4vw,32px);line-height:1.15;letter-spacing:-.02em}
.badge{font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:0}
.big{font-family:var(--display);font-weight:700;font-size:64px}
.tier{padding:8px 0}
.tier em{font-family:var(--mono);font-size:12px}
.tiers,.lb,.rows{border-top:1px dashed var(--line)}
.tier,.lbr,.row{border-bottom:1px dashed var(--line)}
.fb{background:transparent;border:1px dashed var(--line);border-radius:0}
.flight{border-radius:0;border:1px dashed var(--line)}
.flypts{font-family:var(--display);font-weight:700;font-size:28px;top:auto;bottom:10px}
.flyalt{font-family:var(--mono);font-size:15px}
#toast{font-family:var(--display);font-weight:700;font-size:16px;border-radius:0;box-shadow:none;letter-spacing:0}
.btns{align-items:flex-start;gap:4px}
button{background:none;border:none;border-radius:0;padding:8px 2px;font-family:var(--mono);font-weight:700;color:var(--ink);text-align:left}
button::before{content:"[";color:var(--muted);margin-right:.35em;font-weight:400}
button::after{content:"]";color:var(--muted);margin-left:.35em;font-weight:400}
button:hover{color:var(--flame);filter:none}
button.go{background:none;color:var(--flame);font-family:var(--mono);font-size:19px;letter-spacing:0;padding:8px 2px}
button.go::before,button.go::after{color:var(--flame)}
button.link,.snd,.tabs button{text-decoration:none}
button.link::before,button.link::after,.snd::before,.snd::after{content:none}
button.link{color:var(--muted);font-weight:400}
button.link:hover{color:var(--ink)}
.snd::before{content:"♪ ";color:var(--muted)}
.tabs{background:none;border:none;padding:0;gap:14px;justify-content:flex-start}
.tabs button{flex:0 0 auto;color:var(--muted);padding:6px 0}
.tabs button[aria-selected="true"]{background:none;color:var(--flame)}
.row2{gap:14px}
.row2>*{flex:0 0 auto}
input,textarea{background:transparent;border:none;border-bottom:2px solid var(--line);border-radius:0;font-family:var(--mono);padding:10px 2px;color:var(--ink)}
input:focus{border-bottom-color:var(--flame)}
input:focus-visible{outline:none}
form{align-items:flex-end}
.pip{border-radius:0;width:16px;height:5px}
.timer,.timer i{border-radius:0}
.code{font-family:var(--display);font-weight:700;letter-spacing:.12em}
.mark span{font-size:9px}
button:focus-visible{outline:1px dashed var(--flame);outline-offset:3px}
.panel>.top{flex-wrap:nowrap;align-items:flex-start}
.panel>.top .word{font-size:clamp(30px,9vw,44px)}
.panel>.top .alt{flex-shrink:0;max-width:52%}
.panel>.top .alt b{font-size:clamp(13px,3.6vw,18px);white-space:nowrap}
/* ===== Clear buttons ===== */
button.go,button.sec,button.chip{text-align:center;border-radius:12px;font-family:var(--mono);transition:transform .08s,filter .15s,background .15s}
button.go::before,button.go::after,button.sec::before,button.sec::after,button.chip::before,button.chip::after{content:none}
button.go{background:var(--flame);color:#1d1203;border:none;font-weight:800;font-size:18px;padding:14px 18px;box-shadow:0 6px 24px rgba(255,181,71,.25)}
button.go:hover{filter:brightness(1.08);color:#1d1203}
button.go:active,button.sec:active,button.chip:active{transform:scale(.98)}
button.go.big{width:100%;font-size:clamp(16px,4.6vw,20px);padding:17px 12px;letter-spacing:0;white-space:nowrap}
.brief .lede{font-size:15px}
button.sec{background:#141b33;color:var(--ink);border:1.5px solid rgba(232,236,248,.28);font-weight:700;font-size:16px;padding:13px 14px}
button.sec:hover{border-color:var(--flame);color:var(--ink)}
button.chip{background:#141b33;color:var(--ink);border:1.5px solid rgba(232,236,248,.22);font-weight:700;font-size:14px;padding:9px 14px;border-radius:999px}
button.chip:hover{border-color:var(--t4);color:var(--ink)}
.btns.home{gap:10px;align-items:stretch}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
form button.go{padding:0 18px;font-size:17px}
#next{width:100%}
.btns{align-items:stretch}
button:focus-visible{outline:2px solid var(--t2);outline-offset:3px}

.row.tap{cursor:pointer}.row.tap .chev{display:inline-block;color:var(--muted);transition:transform .15s}.row.tap[aria-expanded="true"] .chev{transform:rotate(90deg)}
.row .reveal{grid-column:1 / -1;display:flex;flex-direction:column;gap:6px;padding:8px 0 2px;font-size:13px;line-height:1.5;overflow-wrap:anywhere}
.row .reveal[hidden]{display:none}.row .reveal .tn{font-weight:800;margin-right:6px;text-transform:uppercase;font-size:11px;letter-spacing:.08em}
.faq{display:flex;flex-direction:column;border-top:1px dashed var(--line)}
.faq details{border-bottom:1px dashed var(--line);padding:12px 0}
.faq summary{cursor:pointer;font-weight:800;list-style:none;display:flex;gap:8px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::before{content:"▸";color:var(--muted);transition:transform .15s;display:inline-block}
.faq details[open] summary::before{transform:rotate(90deg)}
.faq details p{margin-top:8px;color:var(--muted);font-size:14px}
.mark span.two{font-size:8px;line-height:1.15;letter-spacing:0}
@media (max-width:380px){.app{grid-template-columns:62px minmax(0,1fr)}.mark span{font-size:8.5px}.panel{padding:16px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="sky"></div>
<canvas id="stars" aria-hidden="true"></canvas>
<div id="toast" role="status" hidden></div>
<div id="bh" hidden aria-hidden="true"><canvas></canvas></div>

<main class="app">
  <aside class="rail" aria-label="Altitude">

    <div class="track" id="track"></div>
  </aside>
  <section class="panel" id="panel" aria-live="polite"></section>
</main>

const FLY={pts:0,thrust:0,jx:0,boost:1,rot:0,running:false,stars:[],clouds:[],parts:[],climbed:0};

    for(let i=0;i<7;i++)FLY.clouds.push({x:Math.random(),y:Math.random(),w:.25+Math.random()*.35});}

function skyAt(p){let i=1;while(i<SKY.length-1&&p>SKY[i][0])i++;const a=SKY[i-1],b=SKY[i];const t=Math.min(1,Math.max(0,(p-a[0])/(b[0]-a[0])));return[mix(a[1],b[1],t),mix(a[2],b[2],t)];}

  const p=vp(FLY.cam),[top,bot]=skyAt(p);const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,top);gr.addColorStop(1,bot);g.fillStyle=gr;g.fillRect(0,0,W,H);

  if(sa>0)for(const s of FLY.stars){s.y+=speed*s.z/H;if(s.y>1){s.y-=1;s.x=Math.random();}const x=s.x*W,y=s.y*H,len=speed*s.z*2.4;g.globalAlpha=sa*(.4+.6*s.z);

  const RY=H*(.62-.1*FLY.lift),yAt=pt=>RY+18-(pt-FLY.cam)*S;
  const yArt=pt=>yAt(remap(pt));

  const rx=W/2+FLY.jx,ry=RY,sc=2.3;

    g.fillStyle=t<.2?`rgba(255,${190+Math.round(50*t/.2)},${90+Math.round(110*t/.2)},${1-t*1.6})`:`rgba(210,218,240,${(1-t)*.35})`;g.beginPath();g.arc(q.x,q.y,q.size*(1+t*2.5),0,6.283);g.fill();}

  if(keys.length>60){keys.filter(k=>k<st.day-56).forEach(k=>delete days[k]);days[st.day]=entry;return writeMe({days});}
  return writeMe({days:{[st.day]:entry}});
}

/* ---------- Logbook: daily missions only ---------- */
function logbook(){
  const days={};
  try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i),m=/^apogee-(\d+)$/.exec(k||"");if(m){const v=store.get(k);if(v&&typeof v.total==="number")days[+m[1]]=v.total;}}}catch(e){}
  if(NET.me&&NET.me.days)for(const d in NET.me.days){const v=NET.me.days[d];if(v&&typeof v.p==="number")days[+d]=v.p;}
  const ks=Object.keys(days).map(Number);if(!ks.length)return null;
  const vals=ks.map(k=>days[k]);
  let t=dayNum();if(days[t]==null)t--;let streak=0;while(days[t]!=null){streak++;t--;}
  return {streak,played:ks.length,avg:Math.round(vals.reduce((a,b)=>a+b,0)/vals.length),best:Math.max(...vals),today:days[dayNum()]};
}

/* ---------- How Apogee works ---------- */
const FAQ=()=>[
["How are the answer lists made?","Each prompt's list is built by pulling together real sources (encyclopedia lists, dictionaries, reference pages, whatever the prompt calls for), then merging and cleaning them into one answer set. Then it's checked by hand: would 20 ordinary people answering in 20 seconds all find their answer on it?"],
["How is rarity decided?","It depends on the prompt. Names and words can be scored by how often they actually turn up in what people read and write. The less familiar the word, the further out it sits. Some prompts can't be boiled down to a number like that (\"something you'd find in a garden\"), so those get a mix of AI help and a manual pass."],
["Why is the Black Hole sometimes less rare than a Deep Space answer?","Because the Black Hole isn't picked on rarity alone. Past a certain depth, rarity is hard to call, so the Black Hole is also chosen for how satisfying it is to land on. Some answers are so obscure that maybe one pilot ever would type them. A Black Hole should be one that at least a few of you actually find."],
["Why wasn't my answer accepted?","Because it wasn't found when the list was built, sorry. Usually that means a source was missed. Fair answers that turn up missing get added, and the aim is for that to happen as rarely as possible."],
["Why does it say “Did you mean…?”","Many answers have several names, and the game checks all of them. A typo that's a letter or two away from one of them gets offered to you. Press Enter to accept it, or keep typing. Singular and plural count as the same answer."],
["Can I suggest a prompt?",`Yes. Submitting a prompt costs ${PRICE}. If it's declined, you're refunded.`],
["What is Apogee+?",`For ${PLUS_PRICE} a month you get five extra themed missions a day: geography, history, general, sport and showbiz. The free daily mission is always free.`],
["Is there an app?","Apogee runs in your browser on phones and computers. On iPhone, tap Share then Add to Home Screen to give it its own icon."]
];

  document.getElementById("home").onclick=intro;
}

function nearLine(gap,name){

/* Varied picking: no two prompts of the same kind, at most two per theme, and (for practice) prompts you've seen recently go to the back */
function family(q){q=q.toLowerCase();
  const F=[["place",/\b(city|cities|town|capital|borough|area of london|county|state capital|province)\b/],["country",/\bcountr(y|ies)\b|\bnation\b/],["island",/\bisland\b/],
    ["film",/\bfilm|movie|pixar|disney|bond|oscar|marvel|star wars\b/],["music",/\bsong|band|singer|album|music|genre\b/],["food",/\bfood|dish|cheese|bread|fruit|vegetable|dessert|sweet|chocolate|drink|cocktail|pasta|crisps|cereal|sauce|spice|soup|biscuit|cake|pizza|sandwich|curry|nut|bean\b/],
    ["animal",/\banimal|bird|fish|cat|dog|shark|whale|snake|insect|creature|mammal|dinosaur|bear|deer|owl|monkey|frog|lizard|rodent|pet\b/],["plant",/\btree|flower|plant|mushroom|grass|crop\b/],
    ["person",/\bpresident|prime minister|monarch|emperor|queen|king|explorer|scientist|painter|poet|philosopher|composer|author|pharaoh|pope|famous person|figure|winner|champion|captain\b/],
    ["water",/\briver|lake|sea|ocean|waterfall\b/],["sportteam",/\bclub|team\b/],["tv",/\bcharacter|tv|show|series|sitcom|cartoon|superhero|villain\b/],["find",/\bfind in|you'd find|you would find\b/]];
  for(const [k,re] of F)if(re.test(q))return k;return q.split(" ").slice(0,3).join(" ");}
function pickFrom(pool,rand,recent){
  const idx=pool.slice();for(let i=idx.length-1;i>0;i--){const j=Math.floor(rand()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]];}
  if(recent&&recent.size){const fresh=idx.filter(i=>!recent.has(BANK[i].q)),old=idx.filter(i=>recent.has(BANK[i].q));idx.length=0;idx.push(...fresh,...old);}
  const out=[],fam=new Set(),th={};
  for(const pass of [0,1,2])for(const i of idx){if(out.length>=ROUNDS)break;if(out.includes(i))continue;const b=BANK[i],f=family(b.q);
    if(pass<2&&fam.has(f))continue;if(pass<1&&(th[b.th]||0)>=(b.th==="show"?1:2))continue;out.push(i);fam.add(f);th[b.th]=(th[b.th]||0)+1;}
  return out;}
/* About a quarter of every mission is geography: 2 of 7 prompts three days in four, otherwise 1 */
function pickMixed(pool,rand,recent){
  const geoN=rand()<.75?2:1;
  const geo=pickFrom(pool.filter(i=>BANK[i].th==="geo"),rand,recent).slice(0,geoN);
  /* everyday "Something..." prompts anyone can answer: two or three per mission */
  const isEvery=i=>/^Something\b/.test(BANK[i].q);
  const evN=rand()<.5?3:2;
  const every=pickFrom(pool.filter(i=>BANK[i].th!=="geo"&&isEvery(i)),rand,recent).slice(0,evN);
  const fams=new Set(every.map(i=>family(BANK[i].q)));
  const filmOK=rand()<.3;/* film prompts turn up in roughly 1 mission in 3 */
  const rest=pickFrom(pool.filter(i=>BANK[i].th!=="geo"&&!isEvery(i)&&(filmOK||family(BANK[i].q)!=="film")),rand,recent).slice(0,ROUNDS-geo.length-every.length);
  const out=geo.concat(every,rest);
  for(let i=out.length-1;i>0;i--){const j=Math.floor(rand()*(i+1));[out[i],out[j]]=[out[j],out[i]];}
  return out;}
function seenSet(){const a=store.get("apogee-seen")||[];return new Set(a);}
function markSeen(list){const a=(store.get("apogee-seen")||[]).filter(q=>!list.includes(q)).concat(list);store.set("apogee-seen",a.slice(-Math.floor(BANK.length*.7)));}
function start(mode){
  if(mode==="daily"&&DAILY.state==="pending"){
    panel.innerHTML=`${header("Mission #"+dayNum())}<h2>Contacting Mission Control…</h2><p class="lede">Receiving today's seven signals.</p>`;
    const t0=Date.now();const wait=()=>{if(DAILY.state!=="pending"||Date.now()-t0>6000){if(DAILY.state==="pending")DAILY.state="none";start("daily");}else setTimeout(wait,150);};
    setTimeout(wait,150);return;}
  CUR="play";
  const all=BANK.map((_,i)=>i).filter(i=>!BANK[i].daily);let prompts;
  if(mode==="daily")prompts=DAILY.state==="ready"?DAILY.idx.slice():pickMixed(all,rng(dayNum()*9973+7));
  else if(mode==="preview")prompts=PREVIEW.idx.slice();
  else if(mode==="practice")prompts=pickMixed(all,Math.random,seenSet());
  else if(mode==="new")prompts=pickMixed(all.filter(i=>i>=NEW_FROM),Math.random,seenSet());
  else{const id=mode.slice(6);const pool=all.filter(i=>BANK[i].th===id);let h=0;for(const c of id)h=h*31+c.charCodeAt(0);
    prompts=pickFrom(pool,rng(dayNum()*7919+h));}
  if(mode==="practice"||mode==="new")markSeen(prompts.map(i=>BANK[i].q));
  S={mode,day:dayNum(),prompts,i:0,results:[],total:0};
  round();
}

function round(){
  const pi=S.prompts[S.i];
  panel.innerHTML=`${header(modeLabel())}
  <div class="prog"><span class="label">Prompt ${S.i+1} of ${S.prompts.length}</span><div class="pips">${S.prompts.map((_,j)=>{const r=S.results[j];return `<span class="pip" style="${r?"background:"+(r.tier>=0?TIERS[r.tier].col:"var(--bad)"):j===S.i?"background:var(--ink)":""}"></span>`}).join("")}</div></div>
  <div><div class="timer" id="timer"><i id="bar"></i></div><div class="secs" id="secs" style="margin-top:6px">${SECONDS}s left</div></div>
  <p class="label">Name…</p>
  <p class="q">${esc(BANK[pi].q)}</p>
  <form id="f" autocomplete="off"><input id="ans" aria-label="Your answer" placeholder="Your rarest answer" autocapitalize="off" spellcheck="false" enterkeyhint="go"><button class="go" type="submit" style="font-size:18px;padding:0 16px">Go</button></form>
  <div class="msg" id="msg"></div>`;
  setAltitude(S.total);
  const inp=document.getElementById("ans"),msg=document.getElementById("msg");inp.focus();
  const t0=performance.now();let over=false,pending=null;
  const finish=(res)=>{if(over)return;over=true;cancelAnimationFrame(timerRaf);feedback(pi,res);};
  const lockIn=m=>finish({answer:m.display,tier:m.tier,pts:TIERS[m.tier].pts,tc:!!m.tc});
  (function tick(now){const left=Math.max(0,SECONDS*1000-(now-t0));const bar=document.getElementById("bar");if(!bar)return;
    bar.style.transform=`scaleX(${left/(SECONDS*1000)})`;document.getElementById("secs").textContent=Math.ceil(left/1000)+"s left";
    document.getElementById("timer").classList.toggle("low",left<5000);
    if(left<=0){finish({answer:inp.value.trim()||"—",tier:-1,pts:0,why:"Out of time",line:pickOne(LINES.time)});return;}
    timerRaf=requestAnimationFrame(tick);})(t0);
  inp.addEventListener("input",()=>{if(pending&&inp.value.trim()!==pending.typed){pending=null;msg.innerHTML="";}});
  document.getElementById("f").onsubmit=e=>{e.preventDefault();const v=inp.value.trim();if(!v)return;
    if(pending&&v===pending.typed){lockIn(pending.m);return;}
    const m=match(pi,v);if(m){lockIn(m);return;}
    const sg=suggest(pi,v);
    if(sg){pending={typed:v,m:sg};
      msg.innerHTML=`<span style="color:var(--ink)">Did you mean <b>${esc(sg.display)}</b>?</span> <button type="button" id="acc" style="padding:2px 4px;margin-left:6px">Accept ↵</button>`;
      document.getElementById("acc").onclick=()=>lockIn(sg);return;}
    if(isSupa()&&NET.ready){try{SUPA.client.from("rejected_answers").insert({user_id:NET.uid,prompt:BANK[pi].q,answer:v.slice(0,80)}).then(()=>{},()=>{});}catch(e){}}
    msg.textContent=`“${v}” isn't on the flight list. Try another.`;inp.classList.remove("shake");void inp.offsetWidth;inp.classList.add("shake");inp.select();
  };
}

function feedback(pi,res){
  const prev=S.total;
  if(res.tier>=0)res.line=(FACTS[BANK[pi].q]||{})[res.answer]||(res.tc?pickOne(TOO_CLEVER_LINES):pickOne(LINES[res.tier]));
  S.results.push(Object.assign({q:BANK[pi].q},res));S.total+=res.pts;
  const t=res.tier>=0?TIERS[res.tier]:null;const last=S.i===S.prompts.length-1;
  const tips=rarer(pi,res.answer);
  panel.innerHTML=`${header(modeLabel(),prev)}
  <div class="prog"><span class="label">Prompt ${S.i+1} of ${S.prompts.length}</span><span class="label">${S.total} pts</span></div>
  <p class="q" style="font-size:clamp(24px,6vw,32px)">${esc(BANK[pi].q)}</p>
  <div class="flight"><canvas id="fly" aria-hidden="true"></canvas><span class="flyalt" id="flyalt">${fmtKm(altitude(prev))}</span><span class="flypts" style="color:${t?t.col:"var(--bad)"}">+${res.pts}</span></div>
  <div class="fb">
    ${t?`<span class="badge" style="color:${t.col}">${res.tc?"Too clever":t.name} <small>+${t.pts}</small></span><p><b>${esc(res.answer)}</b>. ${esc(res.line)}</p>`
       :`<span class="badge" style="color:var(--bad)">${esc(res.why)} <small>+0</small></span><p class="muted">${esc(res.line||LINES.miss[0])}</p>`}
    <p class="note">Out in deep space: ${tips.map(esc).join(", ")}</p>
  </div>
  <button class="go" id="next">${last?"See where you landed":"Next prompt"}</button>`;
  flyInit(prev);
  if(res.tier===3){const to=S.total;blackHole(()=>{if(!document.getElementById("fly"))return;launch(prev,to,3);warp=Math.max(warp,5);});}
  else launch(prev,S.total,res.tier);
  const n=document.getElementById("next");n.focus();
  n.onclick=()=>{S.i++;
    if(last){if(S.mode==="daily"){store.set("apogee-"+S.day,S);S._save=saveDaily(S);}
      else if(S.mode.startsWith("theme:"))store.set(themeKey(S.mode.slice(6)),S);
      results();}
    else round();};
}

function shareText(){const a=passed(S.total),L=S.mode==="daily"?logbook():null;
  return `Apogee · ${modeLabel()} · ${S.total}\n${S.results.map(r=>r.tier>=0?SHARE_EMOJI[r.tier]:"💥").join("")}\n${fmtKm(altitude(S.total))} · ${SHARE_DEST[a.label]||a.label}${rankShort(S.rank)?" · "+rankShort(S.rank):""}${L&&L.streak>1?"\n🔥 "+L.streak+"-day streak":""}`;}

function results(){
  CUR="results";cancelAnimationFrame(timerRaf);
  const a=passed(S.total);const nextIdx=ANCH.findIndex(x=>x.p>S.total);const nxt=nextIdx>=0?ANCH[nextIdx]:null;
  const reset=new Date((Math.floor(Date.now()/864e5)+1)*864e5).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});
  panel.innerHTML=`${header(modeLabel()+" · complete")}
  <div><div class="big">${S.total}</div><p class="label" style="margin-top:6px">points of ${MAXPTS} · ${fmtKm(altitude(S.total))}</p>${S.mode==="daily"&&isSupa()&&NET.ready?`<p id="rank" style="margin-top:8px;color:var(--flame);font-family:var(--mono);font-weight:700;font-size:15px">${S.rank?esc(rankLong(S.rank)):"Checking today's flights…"}</p>`:""}</div>
  ${S.mode==="daily"?logbookHTML():""}
  <p class="lede">${ARRIVE[a.label]}</p>
  ${nxt?`<p class="muted">${nearLine(nxt.p-S.total,SHORTNAME[nxt.label])}</p>`:""}
  <p class="label" style="margin-bottom:-12px">Tap a prompt to see the rare answers</p>
  <div class="rows">${S.results.map((r,j)=>{const t=r.tier>=0?TIERS[r.tier]:null;return `<div class="row tap" data-j="${j}" role="button" tabindex="0" aria-expanded="false"><span class="p">${esc(r.q)} <span class="chev">▸</span></span><span class="a">${esc(r.answer)}</span><span class="s" style="color:${t?t.col:"var(--bad)"}">${t?(r.tc?"Too clever":t.name)+"<br>+"+t.pts:esc(r.why||"Miss")+"<br>+0"}</span><div class="reveal" hidden>${rareHTML(S.prompts[j])}</div></div>`}).join("")}</div>
  ${S.mode==="daily"?`<div><p class="label" style="margin-bottom:6px">Today with your crew</p><div id="mini">${boardHTML("today",5)}</div></div>`:""}
  <div class="btns"><button class="go" id="copy">Copy result</button><div id="copyOut" hidden><textarea id="ct" readonly></textarea></div>
  <div class="duo"><button class="sec" id="lbBtn">Leaderboards</button><button class="sec" id="frBtn">Friends</button></div>
  ${NET.owner?`<button class="sec" id="again">${S.mode==="new"?"Test more new prompts":"Practice flight"}</button>`:""}<button class="link" id="home">Back to mission control</button></div>
  ${S.mode!=="practice"&&S.mode!=="new"&&S.mode!=="preview"?`<p class="note">The next mission launches at ${reset} your time.</p>`:""}`;
  if(S.mode==="daily"&&isSupa()&&NET.ready){const st=S;Promise.resolve(st._save).then(()=>flightRank(st.total)).then(r=>{if(!r)return;st.rank=r;const el=document.getElementById("rank");if(el&&S===st)el.textContent=rankLong(r);});}
  setAltitude(S.total);
  document.getElementById("copy").onclick=e=>{const txt=shareText();const b=e.currentTarget;
    const fallback=()=>{const o=document.getElementById("copyOut");o.hidden=false;const ta=document.getElementById("ct");ta.value=txt;ta.focus();ta.select();b.textContent="Select and copy below";};
    try{navigator.clipboard.writeText(txt).then(()=>{b.textContent="Copied";},fallback);}catch(err){fallback();}};
  const ag=document.getElementById("again");if(ag)ag.onclick=()=>start(S.mode==="new"?"new":"practice");
  document.querySelectorAll(".row.tap").forEach(el=>{const tog=()=>{const rv=el.querySelector(".reveal");rv.hidden=!rv.hidden;el.setAttribute("aria-expanded",String(!rv.hidden));};
    el.onclick=tog;el.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();tog();}};});
  document.getElementById("home").onclick=intro;
  document.getElementById("lbBtn").onclick=()=>leaderboards();
  document.getElementById("frBtn").onclick=friends;
}

panel.addEventListener("click",e=>{const b=e.target.closest&&e.target.closest("#sndBtn");if(!b)return;
  SND.on=!SND.on;store.set("apogee-sound",SND.on);b.textContent="Sound "+(SND.on?"on":"off");b.setAttribute("aria-pressed",SND.on);if(SND.on)SND.ping(1);});
sizeCanvases();addEventListener("resize",()=>{sizeCanvases();placeRocket(shownPts);});
if(RM){skyStar=skyStar;}requestAnimationFrame(frame);
intro();
initNet().then(()=>{if(CUR==="intro"&&!S)intro();});
</script>
